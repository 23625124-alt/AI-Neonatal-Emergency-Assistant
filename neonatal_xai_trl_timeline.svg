<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#ffffff"/>
  <style>
    .heading { font-family: Georgia, 'Times New Roman', serif; font-size: 46px; font-weight: bold; fill: #102d63; }
    .subheading { font-family: Arial, sans-serif; font-size: 24px; fill: #202a38; }
    .axis { font-family: Arial, sans-serif; font-size: 17px; fill: #111111; }
    .bartext { font-family: Arial, sans-serif; font-size: 17px; font-weight: bold; fill: #111111; }
    .small { font-family: Arial, sans-serif; font-size: 15px; fill: #111111; }
  </style>

  <text x="800" y="75" text-anchor="middle" class="heading">TRL LEVEL AND TIMELINE FOR 2 YEARS</text>
  <text x="800" y="125" text-anchor="middle" class="subheading">24-Month TRL Progression for AI-Powered Neonatal XAI Risk Support</text>

  <!-- Plot area: x=130 to 1470, months 1-24 -->
  <g stroke="#c8cdd4" stroke-width="1" stroke-dasharray="4 5">
    <line x1="130" y1="175" x2="130" y2="820"/><line x1="186" y1="175" x2="186" y2="820"/>
    <line x1="242" y1="175" x2="242" y2="820"/><line x1="298" y1="175" x2="298" y2="820"/>
    <line x1="354" y1="175" x2="354" y2="820"/><line x1="410" y1="175" x2="410" y2="820"/>
    <line x1="466" y1="175" x2="466" y2="820"/><line x1="522" y1="175" x2="522" y2="820"/>
    <line x1="578" y1="175" x2="578" y2="820"/><line x1="634" y1="175" x2="634" y2="820"/>
    <line x1="690" y1="175" x2="690" y2="820"/><line x1="746" y1="175" x2="746" y2="820"/>
    <line x1="802" y1="175" x2="802" y2="820"/><line x1="858" y1="175" x2="858" y2="820"/>
    <line x1="914" y1="175" x2="914" y2="820"/><line x1="970" y1="175" x2="970" y2="820"/>
    <line x1="1026" y1="175" x2="1026" y2="820"/><line x1="1082" y1="175" x2="1082" y2="820"/>
    <line x1="1138" y1="175" x2="1138" y2="820"/><line x1="1194" y1="175" x2="1194" y2="820"/>
    <line x1="1250" y1="175" x2="1250" y2="820"/><line x1="1306" y1="175" x2="1306" y2="820"/>
    <line x1="1362" y1="175" x2="1362" y2="820"/><line x1="1418" y1="175" x2="1418" y2="820"/>
    <line x1="1474" y1="175" x2="1474" y2="820"/>
  </g>

  <!-- Phase bars -->
  <rect x="130" y="205" width="224" height="120" fill="#3385ba" stroke="#111111" stroke-width="2"/>
  <text x="242" y="255" text-anchor="middle" class="bartext">Phase 1: Data Readiness</text>
  <text x="242" y="280" text-anchor="middle" class="small">Months 1-4, TRL 3</text>

  <rect x="354" y="350" width="224" height="120" fill="#a8d8e8" stroke="#111111" stroke-width="2"/>
  <text x="466" y="400" text-anchor="middle" class="bartext">Phase 2: Research Testing</text>
  <text x="466" y="425" text-anchor="middle" class="small">Months 5-8, TRL 3-4</text>

  <rect x="578" y="495" width="224" height="120" fill="#d8edf3" stroke="#111111" stroke-width="2"/>
  <text x="690" y="545" text-anchor="middle" class="bartext">Phase 3: Field Prototype</text>
  <text x="690" y="570" text-anchor="middle" class="small">Months 9-12, TRL 5-6</text>

  <rect x="802" y="640" width="336" height="120" fill="#ffb45f" stroke="#111111" stroke-width="2"/>
  <text x="970" y="690" text-anchor="middle" class="bartext">Phase 4: Supervised Pilot Readiness</text>
  <text x="970" y="715" text-anchor="middle" class="small">Months 13-18, TRL 6-7</text>

  <rect x="1138" y="785" width="336" height="120" fill="#df171c" stroke="#111111" stroke-width="2"/>
  <text x="1306" y="835" text-anchor="middle" class="bartext" fill="#ffffff">Phase 5: Prospective Pilot</text>
  <text x="1306" y="860" text-anchor="middle" class="small" fill="#ffffff">Months 19-24, TRL 7-8</text>

  <!-- Axis -->
  <line x1="105" y1="925" x2="1475" y2="925" stroke="#333333" stroke-width="2"/>
  <g class="axis" text-anchor="middle">
    <text x="130" y="950">1</text><text x="186" y="950">2</text><text x="242" y="950">3</text><text x="298" y="950">4</text>
    <text x="354" y="950">5</text><text x="410" y="950">6</text><text x="466" y="950">7</text><text x="522" y="950">8</text>
    <text x="578" y="950">9</text><text x="634" y="950">10</text><text x="690" y="950">11</text><text x="746" y="950">12</text>
    <text x="802" y="950">13</text><text x="858" y="950">14</text><text x="914" y="950">15</text><text x="970" y="950">16</text>
    <text x="1026" y="950">17</text><text x="1082" y="950">18</text><text x="1138" y="950">19</text><text x="1194" y="950">20</text>
    <text x="1250" y="950">21</text><text x="1306" y="950">22</text><text x="1362" y="950">23</text><text x="1418" y="950">24</text>
  </g>
  <text x="800" y="985" text-anchor="middle" class="axis">Timeline (Months)</text>
</svg>
