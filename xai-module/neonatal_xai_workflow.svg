<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <rect width="1400" height="1800" fill="#f7f8fa"/>
  <style>
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 31px; font-weight: bold; fill: #102a56; }
    .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #40516d; }
    .stage { font-family: Arial, sans-serif; font-size: 21px; font-weight: bold; letter-spacing: 1px; }
    .body { font-family: Arial, sans-serif; font-size: 17px; fill: #263445; }
    .output { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1d2f45; }
    .arrow { stroke: #4f5e70; stroke-width: 5; fill: none; }
  </style>

  <rect x="350" y="35" width="700" height="82" rx="15" fill="#ffffff" stroke="#172b4d" stroke-width="3"/>
  <text x="700" y="70" text-anchor="middle" class="title">AI-POWERED NEONATAL</text>
  <text x="700" y="101" text-anchor="middle" class="title">EXPLAINABLE RISK SUPPORT SYSTEM</text>

  <rect x="90" y="160" width="1220" height="245" fill="#e3f2df" stroke="#507a4e" stroke-width="3"/>
  <line x1="90" y1="212" x2="1310" y2="212" stroke="#93ae8f" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="116" y="194" class="stage" fill="#416c40">STAGE 1: DATA COLLECTION &amp; QUALITY AUDIT</text>
  <text x="125" y="255" class="body">
    <tspan x="125" dy="0">• Neonatal observations: temperature, heart rate, breathing, oxygen saturation</tspan>
    <tspan x="125" dy="30">• Weight, feeding, sleep, vaccination status, and reported symptoms</tspan>
    <tspan x="125" dy="30">• Missing-value, binary-field, range, and suspicious-measurement checks</tspan>
  </text>
  <text x="1270" y="365" text-anchor="end" class="output">Functional output: Audited neonatal research dataset</text>

  <path d="M700 405 V450" class="arrow"/><path d="M685 435 L700 455 L715 435" class="arrow"/>

  <rect x="90" y="465" width="1220" height="245" fill="#edf0f3" stroke="#687482" stroke-width="3"/>
  <line x1="90" y1="517" x2="1310" y2="517" stroke="#a9b0b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="116" y="499" class="stage" fill="#4d5b6a">STAGE 2: REPRODUCIBLE PREPROCESSING</text>
  <text x="125" y="560" class="body">
    <tspan x="125" dy="0">• Prepare model-ready features while preserving review flags</tspan>
    <tspan x="125" dy="30">• Separate numeric and categorical inputs with a scikit-learn pipeline</tspan>
    <tspan x="125" dy="30">• Record target distribution, provenance, and transformation metadata</tspan>
  </text>
  <text x="1270" y="670" text-anchor="end" class="output">Functional output: Reproducible prepared dataset</text>

  <path d="M700 710 V755" class="arrow"/><path d="M685 740 L700 760 L715 740" class="arrow"/>

  <rect x="90" y="770" width="1220" height="245" fill="#dfeaf4" stroke="#315a83" stroke-width="3"/>
  <line x1="90" y1="822" x2="1310" y2="822" stroke="#91abc3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="116" y="804" class="stage" fill="#294f77">STAGE 3: NEONATAL RISK MODEL</text>
  <text x="125" y="865" class="body">
    <tspan x="125" dy="0">• Random Forest classifier with balanced class weights</tspan>
    <tspan x="125" dy="30">• Stratified train-test evaluation with probability estimates</tspan>
    <tspan x="125" dy="30">• Accuracy, balanced accuracy, ROC-AUC, confusion matrix, and report</tspan>
  </text>
  <text x="1270" y="975" text-anchor="end" class="output">Functional output: Healthy / at-risk research prediction</text>

  <path d="M700 1015 V1060" class="arrow"/><path d="M685 1045 L700 1065 L715 1045" class="arrow"/>

  <rect x="90" y="1075" width="1220" height="245" fill="#fce9d8" stroke="#bd6b2b" stroke-width="3"/>
  <line x1="90" y1="1127" x2="1310" y2="1127" stroke="#d5a37a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="116" y="1109" class="stage" fill="#a95720">STAGE 4: EXPLAINABILITY &amp; SAFETY REVIEW</text>
  <text x="125" y="1170" class="body">
    <tspan x="125" dy="0">• SHAP contributions for individual observations and global trends</tspan>
    <tspan x="125" dy="30">• What-if analysis to compare feature changes and model outputs</tspan>
    <tspan x="125" dy="30">• Human-readable warning reasons with explicit non-diagnostic boundaries</tspan>
  </text>
  <text x="1270" y="1280" text-anchor="end" class="output">Functional output: Explainable risk evidence for review</text>

  <path d="M700 1320 V1365" class="arrow"/><path d="M685 1350 L700 1370 L715 1350" class="arrow"/>

  <rect x="90" y="1380" width="1220" height="245" fill="#e8e0f2" stroke="#715b91" stroke-width="3"/>
  <line x1="90" y1="1432" x2="1310" y2="1432" stroke="#aa9bc0" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="116" y="1414" class="stage" fill="#634c85">STAGE 5: API-BASED MONITORING WORKFLOW</text>
  <text x="125" y="1475" class="body">
    <tspan x="125" dy="0">• FastAPI service for readings, health checks, and monitoring history</tspan>
    <tspan x="125" dy="30">• Care guidance and date-based reminders for supervised research use</tspan>
    <tspan x="125" dy="30">• Local JSON persistence with clinician review and future pilot gates</tspan>
  </text>
  <text x="1270" y="1585" text-anchor="end" class="output">Functional output: Auditable neonatal decision-support workflow</text>

  <text x="700" y="1710" text-anchor="middle" class="subtitle">Research prototype | Not a diagnosis or substitute for qualified clinical care</text>
</svg>
